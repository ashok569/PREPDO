<!DOCTYPE html>
<!--
  PREPDO — index.html
  BUILD 3 | 2026-08-07
  Changed this build: successful login/activation now redirects to
  app.html instead of showing a dead-end "you're signed in" message
  with nothing else to do.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREPDO — AI Sales Coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%2314213D' stroke-width='3'/%3E%3Cline x1='20.5' y1='20.5' x2='28' y2='28' stroke='%23C87A3E' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #14213D;
    --ink-soft: #3A4B78;
    --paper: #F7F7F5;
    --accent: #C87A3E;
    --accent-soft: #E9C9AC;
    --line: #DCDCD6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .card {
    width: 100%;
    max-width: 380px;
    padding: 48px 36px 36px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 1px 3px rgba(20,33,61,0.06);
  }
  .wordmark { text-align: center; margin-bottom: 40px; }
  .wordmark .prepdo {
    display: block; font-size: 40px; font-weight: 800;
    letter-spacing: 0.5px; color: var(--ink); line-height: 1;
  }
  .wordmark .prepdo span { color: var(--accent); }
  .wordmark .subline {
    display: block; margin-top: 8px; font-size: 12px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft);
  }
  label {
    display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px;
  }
  input[type="email"] {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--paper); color: var(--ink);
  }
  input[type="email"]:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    width: 100%; margin-top: 20px; padding: 13px; font-size: 14px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase; color: #fff; background: var(--ink);
    border: none; border-radius: 3px; cursor: pointer; transition: background 0.15s ease;
  }
  button:hover { background: var(--ink-soft); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 13px; text-align: center; color: var(--ink-soft); min-height: 18px; }
  .status.error { color: #B23A3A; }
  .status.success { color: #2E7D4F; }
  .footer-note { margin-top: 28px; text-align: center; font-size: 11px; color: #9B9B94; }
  .hidden { display: none; }
  .spinner-msg { text-align: center; color: var(--ink-soft); font-size: 14px; }
  .welcome { text-align: center; }
  .welcome .name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
</style>
</head>
<body>

  <div class="card">
    <div class="wordmark">
      <span class="prepdo">PREP<span>DO</span></span>
      <span class="subline">AI Sales Coach</span>
    </div>

    <!-- Shown while resolving an activation/login link or a stored session -->
    <div id="checking" class="spinner-msg">Checking your access...</div>

    <!-- Shown once successfully signed in -->
    <div id="welcomeScreen" class="welcome hidden">
      <div class="name" id="welcomeName"></div>
      <div style="color: var(--ink-soft); font-size: 14px;">You're signed in. (Rest of the app loads here.)</div>
