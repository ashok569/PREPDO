[build]
  publish = "."
  functions = "netlify/functions"

# lmi-context.md is read at runtime via fs.readFileSync, not require()'d
# as code — Netlify's function bundler only auto-detects JS dependencies,
# so a plain data file like this gets silently left out of the deployed
# function package unless explicitly listed here. Without this, the file
# exists in the repo but not in the actual running function (visible as
# an ENOENT for /var/task/lmi-context.md at runtime).
[functions."presales-generate"]
  included_files = ["netlify/functions/lmi-context.md"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
