[build]
  publish = "."
  functions = "netlify/functions"

# lmi-context.md and spin-context.md are read at runtime via
# fs.readFileSync, not require()'d as code — Netlify's function bundler
# only auto-detects JS dependencies, so a plain data file like this
# gets silently left out of the deployed function package unless
# explicitly listed here. Without this, the file exists in the repo but
# not in the actual running function (visible as an ENOENT/"Not found"
# for /var/task/lmi-context.md or /var/task/spin-context.md at
# runtime — this exact error has now happened more than once for
# exactly this reason, so treat this file as load-bearing whenever a
# new function needs either context file).
# BUILD 12: added presales-generate-background alongside the original
# presales-generate — the async rewrite moved the actual file-reading
# code into the new background function, but this config wasn't updated
# to match, so it hit the identical missing-file error again under a
# different function name.
# BUILD 30: LMI/Non-LMI segmentation — every function below also needs
# spin-context.md included, same rule.
[functions."presales-generate"]
  included_files = ["netlify/functions/lmi-context.md", "netlify/functions/spin-context.md"]

[functions."presales-generate-background"]
  included_files = ["netlify/functions/lmi-context.md", "netlify/functions/spin-context.md"]

# BUILD 21: Meeting Analysis's background function also reads
# lmi-context.md at runtime — same rule applies, remembered proactively
# this time instead of discovered via another production failure.
[functions."meeting-analysis-background"]
  included_files = ["netlify/functions/lmi-context.md", "netlify/functions/spin-context.md"]

# BUILD 27: Role Play's debrief background function also reads
# lmi-context.md — added proactively from the start this time.
[functions."roleplay-debrief-background"]
  included_files = ["netlify/functions/lmi-context.md", "netlify/functions/spin-context.md"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
